name: Build Docusaurus site

on:
  push:
    branches:
      - master
  pull_request: {}

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

  schedule:
    - cron: '0 0 * * *'

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - name: Restore cache
        uses: actions/cache@v6
        with:
          path: |
            .next/cache
          # Generate a new cache whenever packages or source files change.
          key: ${{ runner.os }}-docusaurus-${{ hashFiles('**/package-lock.json', '**/yarn.lock') }}-${{ hashFiles('**.[jt]s', '**.[jt]sx') }}
          # If source files changed but packages didn't, rebuild from a prior cache.
          restore-keys: |
            ${{ runner.os }}-docusaurus-${{ hashFiles('**/package-lock.json', '**/yarn.lock') }}-
      - name: Install dependencies
        run: npm ci
      - name: Generate API reference
        run: npm run generate
      - name: Build
        run: npm run build
        env:
          # FontAwesome Pro icons (see dev/installProIcons.ts); without the
          # secret (e.g. in forks), the build uses Flow's default icons
          FONT_AWESOME_PACKAGE_TOKEN: ${{ secrets.FONT_AWESOME_PACKAGE_TOKEN }}
      - name: Install Playwright Browsers Dependencies
        run: npx playwright install-deps
      - name: Install Playwright Browsers
        run: npx playwright install
      - name: Run smoke and dark mode regression tests
        run: npx playwright test tests/smoke.test.ts tests/dark-mode-flow.test.ts --project=chromium
      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: build
          path: build
          retention-days: 1
          include-hidden-files: 'true'

  # Deployment job
  deploy:
    # Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
    # However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
    concurrency:
      group: "deploy"
      cancel-in-progress: false

    environment:
      name: production
      url: https://developer.mittwald.de
    if: success() && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    needs: build
    steps:
      # Provides the Dockerfile and .dockerignore; the site itself is packaged
      # into the container image (see Dockerfile)
      - name: Checkout
        uses: actions/checkout@v7
      - name: Download a single artifact
        uses: actions/download-artifact@v8
        with:
          name: build
          path: build
      - name: Deploy to mittwald container hosting
        id: deploy
        uses: mittwald/zerodeploy-action@v2
        with:
          mittwald-api-token: ${{ secrets.MITTWALD_API_TOKEN }}
          mittwald-project-id: ${{ vars.MITTWALD_PROJECT_ID }}
          service-name: developer-portal
          image-tag: ${{ github.sha }}
