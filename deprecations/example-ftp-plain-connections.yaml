title: "Example: Unencrypted FTP connections"
summary: >-
  FTP connections without TLS will no longer be accepted; use FTPS or SFTP
  instead.
scope: product
announced: 2026-11-01
description: |
  The FTP server currently accepts connections both with and without TLS.
  Unencrypted connections transmit credentials in plain text and will be
  rejected in the future. A sunset date has not been set yet; it will be
  announced here at least three months in advance.
replacement: |
  Configure your FTP client to use **FTPS** (explicit TLS), or use **SFTP**
  with the same credentials.
draft: true
